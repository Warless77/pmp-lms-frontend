name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # package-lock.json is currently out of sync with package.json.
      # npm install reconciles it in the CI workspace; npm ci rejects it.
      - run: npm install
      # Invoke webpack's CLI through Node to avoid executable-bit issues
      # with node_modules/.bin/webpack in the CI runner.
      - run: node ./node_modules/webpack-cli/bin/cli.js --config webpack.config.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
